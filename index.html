<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spotify Clone</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="utility.css">
</head>

<body>

    <div class="container flex bg-black">

        <!-- LEFT SIDEBAR -->
        <div class="left">

            <img class="close" src="img/close.svg" alt="close">


            <div class="home bg-grey rounded m-1 p-1">

                <div class="logo">
                    <img class="invert" src="img/logo.svg" alt="logo">
                </div>


                <ul>
                    <li>
                        <img class="invert" src="img/home.svg">
                        Home
                    </li>

                    <li>
                        <img class="invert" src="img/search.svg">
                        Search
                    </li>
                </ul>

            </div>



            <div class="library bg-grey rounded m-1 p-1">


                <div class="heading">

                    <img class="invert" src="img/playlist.svg">

                    <h2>Your Library</h2>

                </div>


                <div class="songlist">

                    <ul>

                    </ul>

                </div>


                <div class="footer">

                    <div><a href="#">Legal</a></div>
                    <div><a href="#">Safety & Privacy Center</a></div>
                    <div><a href="#">Privacy Policy</a></div>
                    <div><a href="#">Cookies</a></div>
                    <div><a href="#">About Ads</a></div>
                    <div><a href="#">Accessibility</a></div>

                </div>


            </div>


        </div>




        <!-- RIGHT SECTION -->

        <div class="right bg-grey rounded">


            <div class="header">


                <div class="nav">

                    <img class="hamburger" src="img/hamburger.svg">


                    <svg width="24" height="24" viewBox="0 0 24 24">
                        <path fill="white" d="M15 18l-6-6 6-6" />
                    </svg>


                    <svg width="24" height="24" viewBox="0 0 24 24">
                        <path fill="white" d="M9 18l6-6-6-6" />
                    </svg>


                </div>



                <div class="buttons">

                    <button class="SignUpbtn">
                        Sign Up
                    </button>


                    <button class="Loginbtn">
                        Log in
                    </button>


                </div>


            </div>





            <div class="spotifyplaylist">


                <h1 class="neon-title">
                     Ghanshyam's Spotify
                </h1>
                <div class="card-container">
                    <div data-folder="ncs" class="card">

                       
                        


                        <div class="play-button">

                            <svg width="48" height="48">

                                <circle cx="24" cy="24" r="24" fill="#1DB954" />


                                <path d="M19 14v20l16-10z" fill="black" />

                            </svg>

                        </div>

 <img src="https://i.scdn.co/image/ab67616d0000b2732a404b2b13c3b9812048c5cd">
                        <h2>Sambata</h2>
                        <p>PINNAK MADHI</p>


                    </div>

                    <div data-folder="cs" class="card">
                        <!-- <img src="https://i.scdn.co/image/ab67616d0000b2732a404b2b13c3b9812048c5cd"> -->
                         <!-- <img alt="anushkamunde.13's profile picture" class="xpdipgo x972fbf x10w94by x1qhh985 x14e42zd xk390pu x5yr21d xdj266r x14z9mp xat24cr x1lziwak xl1xv1r xexx8yu xyri2b x18d9i69 x1c1uobl x11njtxf xh8yej3" crossorigin="anonymous" draggable="false" src="https://scontent.cdninstagram.com/v/t51.82787-19/724081586_18114958882854148_7847624044304425840_n.jpg?_nc_cat=102&amp;ccb=7-5&amp;_nc_sid=bf7eb4&amp;efg=eyJ2ZW5jb2RlX3RhZyI6InByb2ZpbGVfcGljLnd3dy4xMDgwLkMzIn0%3D&amp;_nc_ohc=yyJ8BbSkk2cQ7kNvwERP5dU&amp;_nc_oc=Adpnf-zNV0Z8Y524uHRMSmRjv2Lc_2UoyFqVI6m0UuxVsY5tJDlDj6C8xDjvWiwg4BrVGiYR4h3oUrlBhSzx9_Bo&amp;_nc_zt=24&amp;_nc_ht=scontent.cdninstagram.com&amp;_nc_gid=Cbyan8RjPL6QZ2Cr-jsduQ&amp;_nc_ss=7b6a8&amp;oh=00_AQCcr9HVRKV1XAqfyRd2UxCFt227S3Db8FDfuqNGc2_kaw&amp;oe=6A69745D"> -->
                         <!-- <img src="gst.jpg" alt="gst"> -->
                        <div class="play-button">
                            <svg width="48" height="48">
                                <circle cx="24" cy="24" r="24" fill="#1DB954" />
                                <path d="M19 14v20l16-10z" fill="black" />
                            </svg>
                        </div>
                        <img src="img/gst.jpg" >
                        <h2>Gst</h2>
                        <p>FINAL SPOTIFY</p>
                    </div>



                </div>





                <!-- PLAYER -->

                <div class="playbar">


                    <div class="seekbar">

                        <div class="circle"></div>

                    </div>



                    <div class="abovebar">


                        <div class="songinfo">

                        </div>



                        <div class="songbuttons">


                            <img id="previous" src="img/previous.svg">

                            <img id="play" src="img/play.svg">

                            <img id="next" src="img/nextsong.svg">

                           <img id="loop" src="img/loop.svg" alt="Loop">


                        </div>



                        <div class="songtime">

                        </div>

                        <div class="volume">

                            <img id="volumeIcon" class="invert" src="img/volume.svg" alt="Volume">
                            

                            <input type="range" id="volumeSlider" min="0" max="100" value="100">
                            

                        </div>
                        



                    </div>


                </div>



            </div>


        </div>



        <script src="script.js"></script>

</body>

</html>
