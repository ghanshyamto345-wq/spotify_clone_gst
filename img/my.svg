<svg xmlns="http://www.w3.org/2000/svg" width="600" height="180" viewBox="0 0 600 180">

    <defs>
        <style>
            .mono{
                fill:none;
                stroke:#ffffff;
                stroke-width:8;
                stroke-linecap:round;
                stroke-linejoin:round;
            }

            .title{
                fill:#ffffff;
                font-family:'SF Pro Display','Helvetica Neue',Arial,sans-serif;
                font-size:34px;
                font-weight:300;
                letter-spacing:.5px;
            }

            .subtitle{
                fill:#a1a1a1;
                font-family:'SF Pro Display','Helvetica Neue',Arial,sans-serif;
                font-size:16px;
                letter-spacing:5px;
            }
        </style>
    </defs>

    <!-- GT Monogram -->

    <g transform="translate(35,25)">

        <!-- G -->

        <path class="mono"
            d="
            M90 25
            A45 45 0 1 0 90 115
            L120 115
            L120 82
            L90 82"/>

        <!-- T -->

        <path class="mono"
            d="
            M150 25
            H235

            M192 25
            V115"/>
    </g>

    <!-- Name -->

    <text x="270" y="82" class="title">
        Ghanshyam
    </text>

    <text x="270" y="120" class="title">
        Todmal
    </text>

    <text x="272" y="148" class="subtitle">
        DESIGN • DEVELOP • ANALYZE
    </text>

</svg>